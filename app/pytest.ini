[pytest]
# 本仓此前**没有任何 pytest 配置** —— 自定义 marker 会触发 PytestUnknownMarkWarning。
#
# 两个 marker 是**两种不同的"跑不了"**，别混：
#   · integration —— 要**真实 Postgres + DashScope 外网**（真检索真 embedding）。本机跑，不进 CI。
#   · needs_db    —— 只要**真实 Postgres**（真写 documents 表）。CI 里没有 postgres service，
#                    故同样不进 CI；但本机跑时**必须**带库名隔离 `POSTGRES_DB=rag_test`。
#
# CI 的口径：`pytest app/ -m "not integration and not needs_db"`
# 🔴 2026-10-09（模块化重构）：**必须显式声明 `pythonpath`**。
#    tests/ 搬到 app/tests/ 之后，pytest 的"rootdir 插入"不再可靠地
#    把 `app/` 放上 sys.path ⇒ 裸导入（`from main import app`）会 ImportError。
#    `pythonpath = .` 的 `.` 是 **rootdir**（= 本文件所在的 app）。
pythonpath = .

markers =
    integration: 需要真实 Postgres(rag_test) + DashScope embedding；不进 CI，本机带 POSTGRES_DB=rag_test 跑
    needs_db: 需要真实 Postgres（会真写 documents 表，无 cleanup）；不进 CI，本机必须带 POSTGRES_DB=rag_test
