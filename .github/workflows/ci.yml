name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      POSTGRES_PASSWORD: ci-dummy-not-a-real-key
      JWT_SECRET_KEY: ci-dummy-not-a-real-key
      LOGIN_PASSWORD: ci-dummy-not-a-real-key
      DASHSCOPE_API_KEY: ci-dummy-not-a-real-key
      LLM_API_KEY: ci-dummy-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest . -m "not integration and not needs_db" -q
