# ruff.toml —— 本仓（fastapi-rag-agent）的静态检查配置
#
# 📌 依据：`docs/规范/开发规范.md` §六「建议的下一步」
#    「加一个**最小的 `ruff` 配置** —— **只开 `E9`（语法错误）+ `F`（未定义名 / 未使用导入）**，
#      这类是**真错误**，不涉及风格争论。」
#
# 📌 2026-10-07 需求方裁：**装 ruff**。
#    ⛔ **不装 pyflakes** —— ruff 的 `F` 规则集就是 pyflakes 的完整重实现；
#    两个都装 = 同一判据两个来源，必然漂移（本仓  记的正是这个病根）。
#    ⛔ **也不写进 `app/requirements.txt`** —— 那份清单会进 本服务镜像，⛔ 不往里塞 linter。
#    装在哪：本机 `venv/bin/ruff`；CI 在 `syntax` job 里临时 `pip install`（版本钉死）。

# ⛔ **只开「真错误」，不开风格** —— E1 / E2 / E3 / E5 / W / I / UP / … 一律不开
#    （本仓没有格式化工具，见 §六·2；风格争论不在这份配置的射程内）。

target-version = "py310"

[lint]
select = ["E9", "F"]


# ============================================================================
# 🔴 接门方式：**基线棘轮**（需求方 2026-10-07 裁，三选一里的 ③）
# ============================================================================
#
# 门 = （本地挂在 本仓的工程配置（⛔ 不随产品仓提供） 第 ⑥ 道，
# CI 挂在 `syntax` job）。
#
#   · 基线文件： —— 记的是 **`<文件>\t<规则号>` 的【集合】**
#   · 判据：只有出现**基线里没有的**（文件×规则）组才红；存量**认了**，⛔ 不拦
#   · 存量（2026-10-07 实测 · ruff 0.16.10）：**40 组 / 103 行**（F401×38 · F541×2）
#     ⚠️ 需求方 2026-10-04 裁 T6「**先挂起**」⇒ 那 100 条未使用导入**不是待办**，是**已知现象**
#
# ⛔ **别把它"简化"成比个数**（`wc -l`）—— 计数**量不到**「这里修掉一条、那里新增一条」：
#    总数不变 ⇒ 门绿 ⇒ **而它本该拦的那件事恰好发生了**。
#    本仓 本仓的复盘记录（⛔ 不随产品仓提供） 记的正是这个病：
#    **「把结论取反，这条命令的输出会变吗？」** —— 用计数，答案是**不会**。
#
# ⚠️ **改 ruff 版本 ⇒ 必须重写基线**
#    并**对着 diff 逐条看一眼**变了什么 —— 规则集在各版本间会变，基线会**静默失真**。
#    脚本自己会核版本（基线头记了 ruff 版本），对不上直接红。


# ============================================================================
# ⚠️ 存量现状（2026-10-07 实测 · ruff 0.16.10）
# ============================================================================
#
#   E9   =   0   ✅ 全仓无语法级错误
#   F401 = 100   🔴 存量「未使用导入」（`app/` 内；全仓 101，多的那条在
#                本仓的工程配置（⛔ 不随产品仓提供））
#   F541 =   1   🔴 存量（一个无占位符的 f-string）
#
# 📌 **交叉验证**：ruff 的  与 `pyflakes` 都数到 100
#    `docs/待办总表.md` T6 原写的 **103** 是**另一口径**（那是 `E9`+`F` 的**全仓**总数），
#    已在 2026-10-07 更正。
